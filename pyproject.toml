[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eventclock"
version = "0.1.0.dev0"
description = "Python port of the eventclock R package: information time from prediction-market prices"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Stöckl" }, { name = "Christoph Gebendorfer" }]
maintainers = [{ name = "Christoph Gebendorfer" }]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyarrow>=18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/cgebe/eventclock-py"
Issues = "https://github.com/cgebe/eventclock-py/issues"
"R package" = "https://github.com/sstoeckl/eventclock"

[tool.hatch.build.targets.wheel]
packages = ["src/eventclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers"]
xfail_strict = true
